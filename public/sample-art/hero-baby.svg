<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="heroHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="60%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#f43f5e" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular Base with glow -->
  <circle cx="300" cy="300" r="270" fill="url(#heroHalo)" filter="url(#heroShadow)" />

  <!-- Double Golden Ornate Rings -->
  <circle cx="300" cy="300" r="260" fill="none" stroke="url(#goldBorder)" stroke-width="6" />
  <circle cx="300" cy="300" r="250" fill="none" stroke="#fbcfe8" stroke-width="2" stroke-dasharray="8,6" />

  <!-- Cloud Base Inside Frame -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="300" cy="400" rx="180" ry="70" />
    <circle cx="210" cy="380" r="55" />
    <circle cx="390" cy="380" r="55" />
  </g>

  <!-- Crescent Golden Moon -->
  <path d="M330,150 C240,150 170,220 170,310 C170,400 240,470 330,470 C280,430 250,370 250,310 C250,250 280,190 330,150 Z" fill="#fde047" stroke="#eab308" stroke-width="3" />

  <!-- Little sleeping baby nestled in cloud & moon -->
  <g transform="translate(300, 310)">
    <!-- Cozy blanket -->
    <path d="M-60,10 C-60,-40 50,-40 60,10 C65,50 30,80 -20,80 C-60,80 -60,40 -60,10 Z" fill="#bae6fd" stroke="#7dd3fc" stroke-width="2" />

    <!-- Baby Head -->
    <circle cx="-15" cy="-20" r="42" fill="#fed7aa" />
    <circle cx="-32" cy="-10" r="9" fill="#f472b6" opacity="0.45" />

    <!-- Cute baby cap with pastel star -->
    <path d="M-28,-36 C-30,-70 12,-70 20,-36 Z" fill="#fbcfe8" />
    <circle cx="0" cy="-68" r="8" fill="#ffffff" />

    <!-- Sleeping eye -->
    <path d="M-30,-20 Q-22,-12 -14,-20" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" />

    <!-- Peaceful lips -->
    <path d="M-22,-5 Q-16,-2 -10,-5" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />

    <!-- Baby hand -->
    <circle cx="15" cy="15" r="12" fill="#fed7aa" />
  </g>

  <!-- Floating Sparkles & Hearts -->
  <g fill="#ec4899">
    <path d="M420,180 C420,165 400,160 390,175 C380,160 360,165 360,180 C360,200 390,220 390,220 C390,220 420,200 420,180 Z" opacity="0.8" />
    <circle cx="140" cy="220" r="4" fill="#fbbf24" />
    <circle cx="460" cy="250" r="5" fill="#fbbf24" />
    <circle cx="430" cy="380" r="4" fill="#f472b6" />
    <circle cx="160" cy="360" r="4" fill="#38bdf8" />
  </g>

  <!-- Ornate Golden Jewels around ring -->
  <circle cx="300" cy="40" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
  <circle cx="560" cy="300" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
  <circle cx="300" cy="560" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
  <circle cx="40" cy="300" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
</svg>
