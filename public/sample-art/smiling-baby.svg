<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="smileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="50%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#smileBg)" />

  <!-- Floating bubbles -->
  <circle cx="150" cy="180" r="32" fill="#bae6fd" opacity="0.35" />
  <circle cx="160" cy="170" r="8" fill="#ffffff" opacity="0.6" />
  <circle cx="680" cy="220" r="40" fill="#fbcfe8" opacity="0.3" />
  <circle cx="690" cy="210" r="10" fill="#ffffff" opacity="0.6" />
  <circle cx="260" cy="480" r="24" fill="#fef08a" opacity="0.4" />
  <circle cx="620" cy="450" r="28" fill="#bae6fd" opacity="0.3" />

  <!-- Decorative Cradle/Frame -->
  <g transform="translate(400, 290)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="170" fill="#ffffff" opacity="0.8" filter="drop-shadow(0 15px 35px rgba(217, 119, 6, 0.15))" />
    <circle cx="0" cy="0" r="162" fill="none" stroke="url(#goldRim)" stroke-width="4" stroke-dasharray="6,4" />

    <!-- Cute Teddy in cradle corner -->
    <g transform="translate(85, 45) scale(0.65)">
      <circle cx="0" cy="0" r="28" fill="#d97706" opacity="0.85" />
      <circle cx="-22" cy="-24" r="12" fill="#b45309" />
      <circle cx="22" cy="-24" r="12" fill="#b45309" />
      <circle cx="-8" cy="-5" r="3.5" fill="#1e293b" />
      <circle cx="8" cy="-5" r="3.5" fill="#1e293b" />
      <ellipse cx="0" cy="8" rx="14" ry="10" fill="#fef3c7" />
      <circle cx="0" cy="4" r="4" fill="#78350f" />
    </g>

    <!-- Baby Body / Onesie -->
    <ellipse cx="0" cy="60" rx="75" ry="65" fill="#bae6fd" />
    <path d="M-35,60 Q0,85 35,60" fill="none" stroke="#38bdf8" stroke-width="3" />

    <!-- Baby Head -->
    <circle cx="0" cy="-25" r="62" fill="#fed7aa" />

    <!-- Curly lock of baby hair -->
    <path d="M-5,-87 Q0,-102 12,-90 Q5,-82 0,-85" fill="#b45309" />

    <!-- Rosy Cheeks -->
    <circle cx="-34" cy="-10" r="14" fill="#fb7185" opacity="0.4" />
    <circle cx="34" cy="-10" r="14" fill="#fb7185" opacity="0.4" />

    <!-- Happy Eyes -->
    <path d="M-36,-28 Q-24,-40 -12,-28" fill="none" stroke="#451a03" stroke-width="4" stroke-linecap="round" />
    <path d="M12,-28 Q24,-40 36,-28" fill="none" stroke="#451a03" stroke-width="4" stroke-linecap="round" />

    <!-- Adorable Big Smile -->
    <path d="M-22,-4 Q0,26 22,-4" fill="#991b1b" stroke="#451a03" stroke-width="3" stroke-linecap="round" />
    <path d="M-15,3 Q0,18 15,3" fill="#fca5a5" />

    <!-- Tiny cute nose -->
    <circle cx="0" cy="-14" r="3" fill="#ea580c" opacity="0.5" />

    <!-- Cute little baby hands reaching up -->
    <circle cx="-55" cy="20" r="14" fill="#fed7aa" />
    <circle cx="55" cy="20" r="14" fill="#fed7aa" />
  </g>

  <!-- Captions below -->
  <text x="400" y="535" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#0369a1">
    Ek Muskurahat, Hazaron Khushiyan 💖
  </text>
  <text x="400" y="565" font-family="'Outfit', sans-serif" font-size="14" text-anchor="middle" fill="#64748b">
    Illustrated Baby Art • Pyari Si Muskurahat
  </text>
</svg>
