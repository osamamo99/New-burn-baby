<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="swaddleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8" />
      <stop offset="50%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#fef3c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#swaddleBg)" />

  <circle cx="400" cy="280" r="210" fill="url(#sunGlow)" />

  <!-- Cloud bed -->
  <g fill="#ffffff" filter="drop-shadow(0 20px 30px rgba(147, 51, 234, 0.08))">
    <ellipse cx="400" cy="380" rx="220" ry="60" />
    <circle cx="300" cy="360" r="50" />
    <circle cx="500" cy="360" r="50" />
  </g>

  <!-- Swaddled Baby -->
  <g transform="translate(400, 270)">
    <!-- Swaddle Wrap -->
    <path d="M-60,40 C-75,100 -50,150 0,165 C50,150 75,100 60,40 C55,10 30,-10 0,0 C-30,-10 -55,10 -60,40 Z" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="2" />

    <!-- Criss-cross swaddle folds -->
    <path d="M-55,50 Q10,70 55,95" fill="none" stroke="#a5b4fc" stroke-width="2.5" />
    <path d="M55,60 Q-10,85 -50,115" fill="none" stroke="#a5b4fc" stroke-width="2.5" />

    <!-- Baby Face -->
    <circle cx="0" cy="0" r="48" fill="#fed7aa" />

    <!-- Baby Cap -->
    <path d="M-45,-15 C-45,-60 45,-60 45,-15 C45,-5 20,5 0,3 C-20,5 -45,-5 -45,-15 Z" fill="#ddd6fe" />
    <!-- Cap Knot -->
    <path d="M-8,-55 C-12,-75 12,-75 8,-55 Z" fill="#c4b5fd" />

    <!-- Sleeping Eyes -->
    <path d="M-26,5 Q-16,14 -8,6" fill="none" stroke="#581c87" stroke-width="3" stroke-linecap="round" />
    <path d="M8,6 Q16,14 26,5" fill="none" stroke="#581c87" stroke-width="3" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="-25" cy="18" r="10" fill="#f472b6" opacity="0.45" />
    <circle cx="25" cy="18" r="10" fill="#f472b6" opacity="0.45" />

    <!-- Pacifier / Cute Lips -->
    <circle cx="0" cy="22" r="7" fill="#fb7185" />
    <circle cx="0" cy="22" r="3" fill="#ffffff" />
  </g>

  <!-- Stars around -->
  <g fill="#fbbf24">
    <circle cx="210" cy="190" r="4" />
    <circle cx="590" cy="170" r="4" />
    <circle cx="240" cy="300" r="3" />
    <circle cx="560" cy="320" r="3.5" />
  </g>

  <text x="400" y="535" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#6b21a8">
    Mohabbat Ki Narm Si Aaghosh 🕊️
  </text>
  <text x="400" y="565" font-family="'Outfit', sans-serif" font-size="14" text-anchor="middle" fill="#64748b">
    Illustrated Baby Art • Swaddled With Love
  </text>
</svg>
