<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="dressBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fdf2f8" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#dressBg)" />

  <!-- Wooden hanger & Cute baby suit -->
  <g transform="translate(400, 230)">
    <!-- Hanger hook -->
    <path d="M0,-85 C15,-85 25,-75 25,-60 C25,-45 0,-40 0,-25" fill="none" stroke="url(#goldAcc)" stroke-width="4" stroke-linecap="round" />
    <!-- Hanger bar -->
    <path d="M-80,-25 Q0,-45 80,-25 L65,-15 Q0,-30 -65,-15 Z" fill="#d97706" />

    <!-- Baby Romper / Suit -->
    <path d="M-55,-15 L-35,35 L-70,55 L-50,75 L-25,50 L-25,120 L25,120 L25,50 L50,75 L70,55 L35,35 L55,-15 Q0,10 -55,-15 Z" fill="#ffffff" filter="drop-shadow(0 15px 30px rgba(180, 83, 9, 0.15))" />
    <path d="M-25,120 L-40,165 L-10,165 L0,135 L10,165 L40,165 L25,120 Z" fill="#ffffff" />

    <!-- Cute Golden Buttons & Bow -->
    <circle cx="0" cy="20" r="4" fill="url(#goldAcc)" />
    <circle cx="0" cy="50" r="4" fill="url(#goldAcc)" />
    <circle cx="0" cy="80" r="4" fill="url(#goldAcc)" />

    <!-- Little embroidered bear on suit pocket -->
    <rect x="8" y="25" width="22" height="24" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
    <circle cx="19" cy="37" r="5" fill="#f59e0b" />

    <!-- Little Booties below -->
    <g transform="translate(-25, 185)">
      <rect x="-14" y="0" width="28" height="22" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="2" />
      <path d="M-5,4 Q0,12 5,4" fill="none" stroke="#b45309" stroke-width="2" />
    </g>
    <g transform="translate(25, 185)">
      <rect x="-14" y="0" width="28" height="22" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="2" />
      <path d="M-5,4 Q0,12 5,4" fill="none" stroke="#b45309" stroke-width="2" />
    </g>
  </g>

  <!-- Cute butterflies and stars -->
  <g fill="#ec4899" opacity="0.65">
    <path d="M180,260 Q195,240 210,260 Q195,275 180,260 M210,260 Q225,240 240,260 Q225,275 210,260" fill="#f472b6" />
    <path d="M620,180 Q635,160 650,180 Q635,195 620,180 M650,180 Q665,160 680,180 Q665,195 650,180" fill="#f472b6" />
  </g>

  <text x="400" y="535" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#b45309">
    Hamari Duniya Ka Sab Se Pyara Sitara ⭐
  </text>
  <text x="400" y="565" font-family="'Outfit', sans-serif" font-size="14" text-anchor="middle" fill="#64748b">
    Illustrated Baby Art • Nanhi Si Poshak
  </text>
</svg>
